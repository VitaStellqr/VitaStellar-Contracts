name: Mutation Tests (Weekly)

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package:
          - fp_math
          - medical_records
          - escrow
          - governor
          - identity_registry

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mutation-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            mutation-${{ matrix.package }}-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run mutation tests
        run: cargo mutants -p ${{ matrix.package }} --timeout 120 --no-times

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-${{ matrix.package }}
          path: mutants.out/
          retention-days: 30
