# Verifies wasm32 builds, tests pass, code is formatted and coverage is reported

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build all contracts for wasm32
        run: |
          for contract in contracts/*/; do
            if [ -d "$contract" ] && [ -f "${contract}Cargo.toml" ]; then
              echo "Building: $(basename "$contract")"
              (cd "$contract" && cargo build --target wasm32-unknown-unknown --release) || exit 1
            fi
          done

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: cargo tarpaulin --workspace --out Xml --out Html --timeout 1200

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: tarpaulin-report.html
          retention-days: 30

  loc-check:
    name: LOC Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate threat-model LOC manifest
        run: |
          chmod +x scripts/loc_report.sh
          ./scripts/loc_report.sh --check

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  error_codes:
    name: Error Codes Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Regenerate error codes reference
        run: python3 scripts/generate_error_codes.py --write

      - name: Check if docs/ERROR_CODES.md is up to date
        run: |
          if git diff --quiet docs/ERROR_CODES.md; then
            echo "✓ docs/ERROR_CODES.md is in sync with contract source"
          else
            echo "✗ docs/ERROR_CODES.md is out of sync"
            echo "Run: python3 scripts/generate_error_codes.py --write"
            git diff docs/ERROR_CODES.md
            exit 1
          fi

  # WASM size monitoring — prevents bloat from merging undetected.
  # See docs/WASM_SIZE_MONITORING.md for details.
  wasm-size-check:
    name: WASM Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Build all contracts (release)
        run: |
          mkdir -p dist
          for contract in contracts/*/; do
            if [ -d "$contract" ] && [ -f "${contract}Cargo.toml" ]; then
              contract_name=$(basename "$contract")
              echo "Building: $contract_name"
              (cd "$contract" && cargo build --target wasm32-unknown-unknown --release) || exit 1
              wasm_file="target/wasm32-unknown-unknown/release/${contract_name}.wasm"
              if [ -f "$wasm_file" ]; then
                cp "$wasm_file" dist/
              fi
            fi
          done

      - name: Check WASM sizes against budgets
        run: |
          chmod +x scripts/wasm_size_monitor.sh
          ./scripts/wasm_size_monitor.sh

      - name: Verify budgets
        run: |
          echo "=== Checking contracts against committed budgets ==="
          BUDGETS_FILE="config/wasm_budgets.json"
          STELLAR_LIMIT=65536
          if [ ! -f "$BUDGETS_FILE" ]; then
            echo "Error: $BUDGETS_FILE not found"
            exit 1
          fi

          exit_code=0
          for wasm_file in dist/*.wasm; do
            if [ -f "$wasm_file" ]; then
              contract_name=$(basename "$wasm_file" .wasm)
              size=$(wc -c < "$wasm_file")
              budget=$(jq -r --arg name "$contract_name" '.budgets[$name] // empty' "$BUDGETS_FILE")

              if [ -z "$budget" ]; then
                echo "WARNING: No budget defined for $contract_name (size: ${size}B)"
                continue
              fi

              if [ "$size" -gt "$STELLAR_LIMIT" ]; then
                echo "WARN: $contract_name exceeds Stellar limit (size: ${size}B > ${STELLAR_LIMIT}B) — pre-existing, not a regression"
              elif [ "$size" -gt "$budget" ]; then
                echo "FAIL: $contract_name exceeds budget! Size: ${size}B, Budget: ${budget}B"
                exit_code=1
              else
                echo "OK: $contract_name (${size}B / ${budget}B)"
              fi
            fi
          done

          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "Some contracts exceeded their size budgets."
            echo "Update config/wasm_budgets.json if the increase is intentional."
          fi
          exit "$exit_code"