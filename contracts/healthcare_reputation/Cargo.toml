[package]
name = "healthcare_reputation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Production builds emit a Soroban WASM (`cdylib`). `rlib` is included so the
# contract types are reachable from the Rust integration test crate at
# `tests/` -- without it, `use healthcare_reputation::...` fails with
# "unlinked crate" because `cdylib` alone produces no Rust-callable artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true
access_utils = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
reputation = { path = "../reputation" }
provider_directory = { path = "../provider_directory" }
credential_registry = { path = "../credential_registry" }
dispute_resolution = { path = "../dispute_resolution" }

[features]
default = []
testutils = ["soroban-sdk/testutils"]
